<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">

    <!-- Channel: website visitors (ct=site) -->
    <!-- TODO: replace with real campaign link at launch -->
    <meta http-equiv="refresh" content="0; url=https://apps.apple.com/app/apple-store/idAPPLE_ID?pt=PROVIDER_TOKEN&amp;ct=site&amp;mt=8">

    <title>Anagrams — App Store</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap');

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            background-color: #13141a;
            color: #e8e6e1;
            font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: clamp(16px, 1rem + 0.3vw, 18px);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        main {
            max-width: min(92vw, 560px);
            text-align: center;
        }

        p {
            margin: 0;
        }

        a {
            color: #e8e6e1;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        a:focus-visible {
            outline: 2px solid #e8e6e1;
            outline-offset: 3px;
            border-radius: 1px;
        }
    </style>
</head>

<body>
    <main>
        <p>Anagrams — Redirecting to the App Store&hellip;</p>
        <p>If nothing happens, <a href="https://apps.apple.com/app/apple-store/idAPPLE_ID?pt=PROVIDER_TOKEN&amp;ct=site&amp;mt=8">tap here</a>.</p>
    </main>
</body>

</html>
