# Keeps toolsonearth.org/anagrams/ in sync with the App Store listing.
# Regenerates anagrams/index.html (and icon) from Apple's public Lookup API
# and commits only when something changed. No secrets required.
name: Sync Anagrams listing

on:
  schedule:
    - cron: "0 10 * * *"   # daily, 10:00 UTC
  workflow_dispatch:         # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["_build/**"]     # template or manual subtitle/promo text edited

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-anagrams-listing
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Regenerate page from App Store listing
        run: python3 _build/build_anagrams_page.py

      - name: Commit and push if changed
        id: commit
        run: |
          git add anagrams/index.html anagrams/icon.jpg
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync Anagrams listing from App Store"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Commits pushed by this workflow's token may not start a Pages build
      # on their own, so ask for one explicitly.
      - name: Request GitHub Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request failed; the push may still trigger a build."
