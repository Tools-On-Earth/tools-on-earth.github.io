            letter-spacing: 0.01em;

        p {
            margin: 0 0 16px;

        }

        .description p:last-child {
            margin-bottom: 0;
        }

        .qr {
            display: block;
            width: 176px;
            height: 176px;
            margin: 0 auto 16px;
            background-color: #ffffff;
            border-radius: 12px;
        }

        .scan p,
        .copyright {
            text-wrap: balance;
        }

        .scan p {
            margin: 0;
        }

        .scan-link {
            font-size: 0.95rem;
        }

        a {
            color: #e8e6e1;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        a:focus-visible {
            outline: 2px solid #e8e6e1;
